<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Reading List · Game of Books</title>
  <meta name="description" content="Five fantasy novels matched to your favourite literary tropes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <header class="site">
      <h1><a href="./">Game of Books</a></h1>
      <p class="flourish" aria-hidden="true">✦ ✦ ✦</p>
    </header>

    <section class="card">
      <div class="results-head">
        <h2>Your reading list</h2>
        <p>Your answers point to these tropes:</p>
        <ul id="tropes" class="chips"></ul>
      </div>

      <p id="status" class="status">Searching the library…</p>
      <ol id="books" class="books"></ol>

      <div class="actions">
        <a class="btn" href="./">Play again</a>
        <button id="share" class="btn ghost" type="button">Copy link to this list</button>
      </div>
    </section>
  </main>

  <footer class="site">
    Book list from Wikipedia's <a href="https://en.wikipedia.org/wiki/List_of_fantasy_novels">List of fantasy novels</a>.
  </footer>

  <script src="js/quiz.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
